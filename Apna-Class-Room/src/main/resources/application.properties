server.port=8085
spring.application.name=Apna-Class-Room
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${gemini_api_key}
spring.ai.google.genai.chat.options.model=gemini-3.7-flash
# If you hit rate limits frequently, you can quickly test switching to Flash:
#spring.ai.google.genai.chat.options.model: gemini-2.5-flash



# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/apna_class_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Dialect (optional)
# Spring Boot / Hibernate automatically detects MySQL dialect
