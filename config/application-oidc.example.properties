# Reference only; NOT loaded by the application by default.
# Adapt a copy OUTSIDE source control, then add:
# --spring.config.additional-location=file:C:/secure/application-oidc.properties
# Secrets stay in external environment/secret-store keys, never in this file or database.
# AUTH_GOOGLE_ENABLED / AUTH_SSO_ENABLED remain false unless explicitly enabled externally.

# Shared Google provider: code and issuer are exact.
app.user.providers.google.issuer-uri=https://accounts.google.com
app.user.providers.google.client-id=${GOOGLE_CLIENT_ID:}
app.user.providers.google.secret-ref=GOOGLE_CLIENT_SECRET
app.user.providers.google.redirect-uri=${GOOGLE_REDIRECT_URI:https://books.example.invalid/login/oauth2/code/google}

# Company example ONLY. Replace every org-123 with the pending row's real org-{tenantId} code.
# The external definition must agree with that tenant's ACTIVE identity_providers row.
app.user.providers.org-123.issuer-uri=${COMPANY_OIDC_ISSUER_URI:https://id.example.invalid/realms/company}
app.user.providers.org-123.client-id=${COMPANY_OIDC_CLIENT_ID:}
app.user.providers.org-123.secret-ref=COMPANY_OIDC_CLIENT_SECRET
app.user.providers.org-123.redirect-uri=${COMPANY_OIDC_REDIRECT_URI:https://books.example.invalid/login/oauth2/code/org-123}
# If the company requires an exact tid claim, uncomment and replace with its trusted value.
# app.user.providers.org-123.external-tenant-id=YOUR_VERIFIED_PROVIDER_TENANT_ID

# Exact callback format: https://YOUR_BACKEND_OR_PROXY/login/oauth2/code/PROVIDER_CODE
# HTTPS issuers only. HTTP callback allowed only for localhost/127.0.0.1 development.
# Existing confidential clients must support PKCE. No arbitrary issuer is accepted at login.
# Operator activation is explicit ONE-SHOT command-line configuration, not enabled here:
# --app.user.provider-setup.code=google
# or --app.user.provider-setup.code=org-123 --app.user.provider-setup.enroll-user-id=YOUR_PENDING_OWNER_USER_ID
# Remove the one-shot arguments after setup/enrollment mail; retain the trusted provider definition.
