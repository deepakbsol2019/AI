spring.application.name=AiAudioToTextTranscript
server.port=8085
# ==================================================
# Existing chat model: LOCAL OLLAMA
# ==================================================
spring.ai.model.chat=ollama

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma4:e2b
spring.ai.ollama.chat.options.temperature=0.2

# ==================================================
# Audio transcription: SAME LOCAL OLLAMA MODEL
# Use the OpenAI-compatible client implementation
# ==================================================
spring.ai.model.audio.transcription=openai

spring.ai.openai.base-url=http://localhost:11434/v1

# Placeholder required by the client; not an OpenAI account key
spring.ai.openai.api-key=ollama

# Actual model running inside Ollama
spring.ai.openai.audio.transcription.model=gemma4:e2b
spring.ai.openai.audio.transcription.response-format=json
spring.ai.openai.audio.transcription.temperature=0

# Local model loading/inference can take time
spring.ai.openai.timeout=5m
spring.ai.openai.max-retries=0

# Disable unused model integrations in this application
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none

spring.datasource.url=jdbc:mysql://localhost:3306/ai_help_desk_app
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
