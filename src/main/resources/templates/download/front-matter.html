<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book download</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style type="text/css">
        @page { size: A4; margin: 54pt; }
        body { margin: 0; font-family: 'Download Noto Sans'; color: #172c3d; font-size: 12pt; line-height: 1.5; }
        .cover { padding-top: 90pt; page-break-after: always; }
        .cover-rule { width: 48pt; border-top: 4pt solid #276b77; margin-bottom: 26pt; }
        h1 { font-size: 24pt; line-height: 1.25; font-weight: 700; margin: 0 0 24pt 0; word-wrap: break-word; }
        .author { color: #405b67; font-size: 15pt; margin: 0; word-wrap: break-word; }
        h2 { font-size: 23pt; line-height: 1.25; font-weight: 700; margin: 0 0 24pt 0; }
        .topic { padding: 9pt 0; border-bottom: 0.5pt solid #dfe7eb; page-break-inside: avoid; word-wrap: break-word; }
    </style>
</head>
<body>
<div class="cover">
    <div class="cover-rule"></div>
    <h1 th:if="${bookName != null}" th:text="${bookName}"></h1>
    <p class="author" th:if="${authorName != null}" th:text="${authorName}"></p>
</div>
<div class="contents">
    <h2>Contents</h2>
    <div class="topic" th:each="topicName : ${topicNames}" th:text="${topicName}"></div>
</div>
</body>
</html>
