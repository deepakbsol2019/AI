# MySQL Database Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/search_book_download?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Dialect (optional)
# Spring Boot / Hibernate automatically detects MySQL dialect

#ollma server url-> http://localhost:11434/
#list model image list-> ollama list
