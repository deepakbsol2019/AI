spring.application.name=Book-Search-Download
server.port=9090

#pass= Anatpur@Patna@123

# Upload limits; request size includes multipart boundaries and other form fields.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB


logging.level.org.springframework.ai.chat.client.advisor=DEBUG
# Comma-separated examples; replace with your restricted keywords (case-insensitive substring matching).
app.ai.restricted-keywords=malware,phishing
# Applies only to PDF extraction requests; every batch uses its native JSON schema.
app.ai.extraction.context-window=16384
app.ai.extraction.max-output-tokens=4096
app.ai.extraction.max-attempts=2
# Local layout-aware chapter-opening detection (no extra model request).
app.pdf.chapter.look-ahead-pages=2
app.pdf.chapter.heading-font-ratio=1.18
app.pdf.chapter.minimum-separation=10
app.pdf.chapter.margin-fraction=0.15
app.pdf.chapter.maximum-heading-gap=80
app.pdf.chapter.maximum-heading-lines=4
# Topic PDF files are retained only when the entire upload transaction commits.
app.topic-pdf.storage-root=${TENANT_STORAGE_ROOT:C:/workspace/backend/Book_Search/upload-pdf}
app.topic-pdf.max-attempts=3
app.topic-pdf.pool-size=4
app.topic-pdf.queue-capacity=256
# Book orchestration uses a separate pool so waiting for topic workers cannot exhaust their executor.
app.book-upload.pool-size=2
app.book-upload.queue-capacity=8
