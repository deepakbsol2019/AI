#model stop --> ollama stop qwen3:1.7b

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5-coder:7b
#spring.ai.ollama.chat.options.format=json
spring.ai.ollama.chat.options.temperature=0.2





# Gmail SMTP server
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Your full Gmail address and Google app password
spring.mail.username=${SMTP_USERNAME:deepakbsol2019@gmail.com}
spring.mail.password=${SMTP_PASSWORD:rjlo fqpt tgue zayf}

spring.mail.default-encoding=UTF-8

# SMTP authentication
spring.mail.properties[mail.smtp.auth]=true

# Port 587 uses STARTTLS
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true

# Verify the SMTP server's identity
spring.mail.properties[mail.smtp.ssl.checkserveridentity]=true

# Timeouts in milliseconds
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=10000
spring.mail.properties[mail.smtp.writetimeout]=10000

# Send from the same Gmail account used for authentication
app.mail.from=${SMTP_FROM:${SMTP_USERNAME:deepakbsol2019@gmail.com}}

# Authentication schema is installed by db/manual/20261125_user_auth.sql, never by Hibernate updates.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Local development signing material survives Maven clean; environment configuration takes priority.
# Keep the legacy import for existing workspaces; the durable config file takes precedence.
spring.config.import=optional:file:./target/local-jwt.properties,optional:file:./config/local-jwt.properties
app.user.jwt.secret=${AUTH_JWT_SECRET:${app.user.dev.jwt-secret:}}
app.user.jwt.issuer=${AUTH_JWT_ISSUER:book-search-download}
app.user.jwt.audience=${AUTH_JWT_AUDIENCE:book-search-ui}
app.user.public-base-url=${AUTH_PUBLIC_BASE_URL:http://localhost:4200}
app.user.trusted-origins=${AUTH_TRUSTED_ORIGINS:http://localhost:4200}
app.user.cookie.secure=${AUTH_COOKIE_SECURE:true}
app.user.google.enabled=${AUTH_GOOGLE_ENABLED:false}
app.user.sso.enabled=${AUTH_SSO_ENABLED:false}
# Development uses the SMTP settings above; deployments can explicitly disable delivery.
app.user.mail.enabled=${AUTH_MAIL_ENABLED:true}
app.user.password.setup-ttl=PT24H
app.user.password.reset-ttl=${PASSWORD_RESET_TTL:PT15M}
app.user.password.enrollment-ttl=PT30M
app.user.password.max-failures=5
app.user.password.lockout=PT15M

# Authentication DTOs and token-bearing provider callbacks must not be logged.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.jdbc.core=INFO
spring.mvc.log-request-details=false
spring.mail.properties[mail.debug]=false

# Temporary OIDC state/nonce/PKCE handshake cookie; never an application API login.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${AUTH_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=10m

# Durable user deletion worker; hard deletions require separately confirmed authenticated API commands.
app.user.deletion.enabled=${USER_DELETION_ENABLED:true}
app.user.deletion.poll-ms=${USER_DELETION_POLL_MS:5000}
# Operator-only, idempotent directory creation; never copies or assigns legacy shared files.
app.user.storage.backfill-individuals=${INDIVIDUAL_STORAGE_BACKFILL:false}
